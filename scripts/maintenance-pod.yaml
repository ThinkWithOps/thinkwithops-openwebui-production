apiVersion: v1
kind: Pod
metadata:
  name: openwebui-maintenance
  namespace: thinkwithops-openwebui
  labels: {app.kubernetes.io/instance: openwebui, app.kubernetes.io/component: maintenance}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: data
      image: ghcr.io/open-webui/open-webui:v0.11.3
      command: [python, -c, "import time; time.sleep(3600)"]
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: 500m, memory: 512Mi}
      volumeMounts: [{name: data, mountPath: /data}]
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: openwebui}
