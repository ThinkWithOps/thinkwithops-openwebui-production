# Keep fixed names: scripts intentionally operate on this dedicated release only.
appConfig:
  WEBUI_AUTH: "True"
  ENABLE_SIGNUP: "False"
  ENABLE_PERSISTENT_CONFIG: "False"
  UVICORN_WORKERS: "1"
  ENABLE_DB_MIGRATIONS: "True"
  # V1 is chat-only. Avoid embedding/Whisper downloads during a short lab session.
  RAG_EMBEDDING_MODEL_AUTO_UPDATE: "False"
  WHISPER_MODEL_AUTO_UPDATE: "False"
  HF_HUB_OFFLINE: "1"
  ENABLE_COMMUNITY_SHARING: "False"
postgresql:
  image: postgres:17.11-bookworm
  storageClass: ""
  size: 5Gi
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "1", memory: 768Mi}
redis:
  image: redis:7.4.11-alpine3.21
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: 500m, memory: 192Mi}
open-webui:
  fullnameOverride: openwebui
  workload: {kind: Deployment}
  replicaCount: 1
  strategy: {type: Recreate}
  image:
    repository: ghcr.io/open-webui/open-webui
    tag: v0.11.3
    pullPolicy: IfNotPresent
  ollama: {enabled: false}
  pipelines: {enabled: false}
  tika: {enabled: false}
  terminals: {enabled: false}
  websocket:
    enabled: true
    manager: redis
    redis: {enabled: false}
    existingSecret: openwebui-secrets
    existingSecretKey: REDIS_URL
  service: {type: ClusterIP, port: 80, containerPort: 8080}
  ingress: {enabled: false}
  persistence:
    enabled: true
    provider: local
    size: 5Gi
    accessModes: [ReadWriteOnce]
    storageClass: ""
    annotations: {helm.sh/resource-policy: keep}
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}
  copyAppData:
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
  startupProbe:
    httpGet: {path: /health, port: http}
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 90
  readinessProbe:
    httpGet: {path: /health/db, port: http}
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  livenessProbe:
    httpGet: {path: /health, port: http}
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  enableOpenaiApi: true
  # Deliberately unusable until an approved endpoint is selected.
  openaiBaseApiUrl: https://model-endpoint.invalid/v1
  openaiApiKey: ""
  openaiApiKeyExistingSecret: openwebui-secrets
  openaiApiKeyExistingSecretKey: OPENAI_API_KEY
  databaseUrl: ""
  extraEnvFrom:
    - configMapRef: {name: openwebui-config}
  extraEnvVars:
    - name: DATABASE_URL
      valueFrom: {secretKeyRef: {name: openwebui-secrets, key: DATABASE_URL}}
    - name: WEBUI_SECRET_KEY
      valueFrom: {secretKeyRef: {name: openwebui-secrets, key: WEBUI_SECRET_KEY}}
    - name: WEBUI_ADMIN_EMAIL
      valueFrom: {secretKeyRef: {name: openwebui-secrets, key: WEBUI_ADMIN_EMAIL}}
    - name: WEBUI_ADMIN_PASSWORD
      valueFrom: {secretKeyRef: {name: openwebui-secrets, key: WEBUI_ADMIN_PASSWORD}}
