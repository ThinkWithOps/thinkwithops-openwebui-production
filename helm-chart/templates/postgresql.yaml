apiVersion: v1
kind: Service
metadata:
  name: openwebui-postgresql
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgresql}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openwebui-postgresql
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}}
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.postgresql.storageClass }}
  storageClassName: {{ .Values.postgresql.storageClass | quote }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.postgresql.size }}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openwebui-postgresql
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  serviceName: openwebui-postgresql
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgresql}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgresql}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 999, runAsUser: 999, runAsGroup: 999, runAsNonRoot: true}
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image | quote }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: openwebui}
            - {name: POSTGRES_DB, value: openwebui}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: openwebui-secrets, key: POSTGRES_PASSWORD}}
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          startupProbe:
            exec: {command: [pg_isready, -U, openwebui, -d, openwebui]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [pg_isready, -U, openwebui, -d, openwebui]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [pg_isready, -U, openwebui, -d, openwebui]}
            periodSeconds: 30
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: openwebui-postgresql}
