apiVersion: v1
kind: Service
metadata:
  name: openwebui-redis
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui-redis
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: redis}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          # Password is read from a mounted config, never placed in process arguments.
          command: [redis-server, /run/redis-secret/redis.conf]
          env:
            - name: REDISCLI_AUTH
              valueFrom: {secretKeyRef: {name: openwebui-secrets, key: REDIS_PASSWORD}}
          ports: [{name: redis, containerPort: 6379}]
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          startupProbe:
            exec: {command: [sh, -ec, 'test "$(redis-cli ping)" = PONG']}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: {command: [sh, -ec, 'test "$(redis-cli ping)" = PONG']}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [sh, -ec, 'test "$(redis-cli ping)" = PONG']}
            periodSeconds: 30
          volumeMounts:
            - {name: config, mountPath: /run/redis-secret, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          secret:
            secretName: openwebui-secrets
            defaultMode: 0440
            items: [{key: redis.conf, path: redis.conf}]
        - name: data
          emptyDir: {}
